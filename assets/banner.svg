<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" /><stop offset="50%" stop-color="#08142c" /><stop offset="100%" stop-color="#010612" />
    </linearGradient>
    <linearGradient id="wtNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"><animate attributeName="stop-color" values="#eab308;#38bdf8;#818cf8;#eab308" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#ec4899;#eab308;#38bdf8" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#818cf8"><animate attributeName="stop-color" values="#818cf8;#eab308;#38bdf8;#818cf8" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="wtGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" /><stop offset="100%" stop-color="#eab308" stop-opacity="0.35" />
    </linearGradient>
    <filter id="wtGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes wtOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes wtFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .solar-orbit { transform-origin: center; animation: wtOrbit 20s linear infinite; }
    .floating-weather { animation: wtFloat 6s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#wtBg)" />

  <!-- 3D Perspective Ground Grid -->
  <g opacity="0.65">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="200" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="400" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="600" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="800" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1000" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#wtGrid)" stroke-width="1.5" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#eab308" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Ambient Light -->
  <circle cx="200" cy="110" r="140" fill="#eab308" opacity="0.08" filter="url(#wtGlow)" />
  <circle cx="960" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="url(#wtGlow)" />

  <!-- 3D Holographic Celestial Orbit & Sun Core -->
  <g transform="translate(940, 180)" class="floating-weather">
    <!-- Elliptical Planetary Orbits -->
    <ellipse cx="0" cy="0" rx="105" ry="45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="80" ry="32" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.5" transform="rotate(35)" />

    <!-- Glowing Sun Center -->
    <circle cx="0" cy="0" r="18" fill="#eab308" filter="url(#wtGlow)">
      <animate attributeName="r" values="16;22;16" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#eab308;#f97316;#38bdf8;#eab308" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Planet 1 -->
    <circle cx="75" cy="-30" r="6" fill="#38bdf8" filter="url(#wtGlow)" />
    <!-- Orbiting Planet 2 -->
    <circle cx="-60" cy="20" r="4" fill="#a855f7" filter="url(#wtGlow)" />

    <!-- Floating Badges -->
    <g transform="translate(-120, -50)">
      <rect x="0" y="0" width="82" height="22" rx="6" fill="#08142c" stroke="#eab308" stroke-width="1" />
      <text x="41" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">VSOP87 ORBITS</text>
    </g>
    <g transform="translate(65, 30)">
      <rect x="0" y="0" width="75" height="22" rx="6" fill="#08142c" stroke="#38bdf8" stroke-width="1" />
      <text x="37" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">OPEN-METEO</text>
    </g>
    <g transform="translate(-40, 70)">
      <rect x="0" y="0" width="82" height="22" rx="6" fill="#08142c" stroke="#818cf8" stroke-width="1" />
      <text x="41" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle">ECMWF / GFS</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="265" height="24" rx="12" fill="#eab308" fill-opacity="0.12" stroke="#eab308" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#eab308" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#eab308" letter-spacing="2">CELESTIAL &amp; METEOROLOGICAL OS</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#wtNeon)" filter="url(#wtGlow)" letter-spacing="3">
      PIMX_WEATHER
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ Planetary Orbits, Solar Radiation Models &amp; Global Forecasts
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#08142c" stroke="#eab308" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">🪐 VSOP87 Analytical</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#08142c" stroke="#38bdf8" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">☀️ Solar Azimuth Math</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#08142c" stroke="#818cf8" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">🌦️ ECMWF &amp; GFS</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#08142c" stroke="#34d399" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">🌍 Zero API Keys</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#wtNeon)" stroke-width="3" filter="url(#wtGlow)" />
</svg>